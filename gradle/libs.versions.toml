# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.1.0"
kotlinxDatetime = "0.6.1"
kotlinxSerializationJSON = "1.7.3"
kotlinxCoroutines = "1.9.0"
kotlinReflect = "2.2.21"
# Compose Multiplatform
composeBom = "1.9.3"

# mosaic 界面库
mosaic = "0.18.0"

# OkHttp 、Retrofit、Gson 网络请求相关库
okhttp = "4.12.0"
retrofit = "2.9.0"
gson = "2.10.1"

# 日志库
log4j = "2.20.0"

# sqlite-jdbc 库
sqliteJdbc = "3.50.3.0"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Compose Multiplatform libraries
composeMaterial3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeBom" }
desktopCurrentJvm = { group = "org.jetbrains.compose.desktop", name = "desktop-current-jvm", version.ref = "composeBom" }

# mosaic 界面库
mosaicRuntime = { module = "com.jakewharton.mosaic:mosaic-runtime", version.ref = "mosaic" }
mosaicAnimation = { module = "com.jakewharton.mosaic:mosaic-animation", version.ref = "mosaic" }
mosaicTerminal = { module = "com.jakewharton.mosaic:mosaic-terminal", version.ref = "mosaic" }
mosaicTty = { module = "com.jakewharton.mosaic:mosaic-tty", version.ref = "mosaic" }
mosaicTtyTerminal = { module = "com.jakewharton.mosaic:mosaic-tty-terminal", version.ref = "mosaic" }
mosaicTesting = { module = "com.jakewharton.mosaic:mosaic-testing", version.ref = "mosaic" }

# OkHttp 、Retrofit、Gson 网络请求相关库
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofitGson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# 日志库
log4jApi = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4jCore = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

# 数据库相关
sqliteJdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc"}
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlinReflect"}

# Libraries can be bundled together for easier import
[bundles]
kotlinxEcosystem = ["kotlinxDatetime", "kotlinxSerialization", "kotlinxCoroutines"]
log4jEcosystem = ["log4jApi", "log4jCore"]

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# mosaic 需要的Compose支持库
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Kotlin Multiplatform plugin alias
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

# JetBrains Compose Multiplatform Gradle plugin
composePlugin = { id = "org.jetbrains.compose", version.ref = "composeBom" }
